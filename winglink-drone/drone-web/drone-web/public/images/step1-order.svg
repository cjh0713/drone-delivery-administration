<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  
  <!-- 装饰圆 -->
  <circle cx="100" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="700" cy="400" r="120" fill="rgba(255,255,255,0.08)"/>
  
  <!-- 订单表单 -->
  <rect x="200" y="100" width="400" height="300" rx="16" fill="white" opacity="0.95"/>
  
  <!-- 表单标题 -->
  <rect x="240" y="140" width="120" height="24" rx="4" fill="#667eea"/>
  
  <!-- 输入框 -->
  <rect x="240" y="190" width="320" height="40" rx="8" fill="#f5f7fa"/>
  <rect x="250" y="202" width="200" height="16" rx="2" fill="#c0c4cc"/>
  
  <rect x="240" y="250" width="320" height="40" rx="8" fill="#f5f7fa"/>
  <rect x="250" y="262" width="180" height="16" rx="2" fill="#c0c4cc"/>
  
  <!-- 提交按钮 -->
  <rect x="240" y="320" width="140" height="44" rx="22" fill="#67c23a"/>
  
  <!-- 无人机图标 -->
  <g transform="translate(600, 80)">
    <ellipse cx="50" cy="20" rx="40" ry="8" fill="rgba(255,255,255,0.3)"/>
    <rect x="30" y="25" width="40" height="20" rx="4" fill="white"/>
    <line x1="10" y1="35" x2="30" y2="35" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="35" x2="90" y2="35" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <circle cx="10" cy="35" r="6" fill="white" opacity="0.8"/>
    <circle cx="90" cy="35" r="6" fill="white" opacity="0.8"/>
  </g>
  
  <!-- 小装饰 -->
  <circle cx="150" cy="350" r="30" fill="rgba(255,255,255,0.15)"/>
  <circle cx="650" cy="150" r="20" fill="rgba(255,255,255,0.1)"/>
</svg>