<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white" opacity="0.8"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- 装饰圆 -->
  <circle cx="150" cy="100" r="80" fill="rgba(255,255,255,0.08)"/>
  <circle cx="650" cy="400" r="100" fill="rgba(255,255,255,0.06)"/>
  
  <!-- 地图网格 -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1">
    <line x1="100" y1="150" x2="700" y2="150"/>
    <line x1="100" y1="250" x2="700" y2="250"/>
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="200" y1="50" x2="200" y2="450"/>
    <line x1="400" y1="50" x2="400" y2="450"/>
    <line x1="600" y1="50" x2="600" y2="450"/>
  </g>
  
  <!-- 禁飞区 -->
  <circle cx="350" cy="200" r="50" fill="rgba(245,108,108,0.3)" stroke="rgba(245,108,108,0.6)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="350" y="205" text-anchor="middle" font-size="12" fill="white" opacity="0.9">禁飞区</text>
  
  <!-- 起点 -->
  <circle cx="180" cy="350" r="25" fill="white"/>
  <circle cx="180" cy="350" r="25" fill="#67c23a" opacity="0.2"/>
  <text x="180" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#67c23a">起</text>
  <text x="180" y="395" text-anchor="middle" font-size="11" fill="white">发货地</text>
  
  <!-- 终点 -->
  <circle cx="620" cy="150" r="25" fill="white"/>
  <circle cx="620" cy="150" r="25" fill="#f56c6c" opacity="0.2"/>
  <text x="620" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#f56c6c">终</text>
  <text x="620" y="115" text-anchor="middle" font-size="11" fill="white">收货地</text>
  
  <!-- 航线（绕过禁飞区） -->
  <path d="M 205 340 Q 280 320, 300 280 T 380 220 T 500 180 T 595 165" 
        fill="none" stroke="white" stroke-width="4" stroke-linecap="round" 
        marker-end="url(#arrowhead)" opacity="0.9"/>
  
  <!-- 航线路径点 -->
  <circle cx="300" cy="280" r="6" fill="white" opacity="0.8">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="220" r="6" fill="white" opacity="0.8">
    <animate attributeName="r" values="4;8;4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="180" r="6" fill="white" opacity="0.8">
    <animate attributeName="r" values="4;8;4" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 飞行中的无人机 -->
  <g transform="translate(420, 200)">
    <rect x="-20" y="-8" width="40" height="16" rx="4" fill="white"/>
    <line x1="-30" y1="0" x2="-20" y2="0" stroke="white" stroke-width="3"/>
    <line x1="20" y1="0" x2="30" y2="0" stroke="white" stroke-width="3"/>
    <circle cx="-30" cy="0" r="4" fill="white"/>
    <circle cx="30" cy="0" r="4" fill="white"/>
    <!-- 位置标记 -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="35;50;35" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 距离标记 -->
  <rect x="480" y="280" width="100" height="30" rx="15" fill="rgba(0,0,0,0.3)"/>
  <text x="530" y="300" text-anchor="middle" font-size="13" fill="white">3.5 km</text>
</svg>