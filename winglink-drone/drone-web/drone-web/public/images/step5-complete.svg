<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#bg5)"/>
  
  <!-- 装饰圆 -->
  <circle cx="100" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="700" cy="400" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="600" cy="100" r="50" fill="rgba(255,255,255,0.06)"/>
  
  <!-- 成功大图标 -->
  <g transform="translate(400, 220)">
    <!-- 外圈 -->
    <circle cx="0" cy="0" r="120" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <circle cx="0" cy="0" r="100" fill="rgba(255,255,255,0.2)"/>
    
    <!-- 对勾 -->
    <circle cx="0" cy="0" r="70" fill="white"/>
    <path d="M -30 0 L -10 25 L 40 -30" fill="none" stroke="#67c23a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="0, 200" to="200, 0" dur="1s" fill="freeze"/>
    </path>
    
    <!-- 光芒 -->
    <g stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="-130">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="106" y1="-106" x2="92" y2="-92">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="150" y1="0" x2="130" y2="0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="106" y1="106" x2="92" y2="92">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="150" x2="0" y2="130">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-106" y1="106" x2="-92" y2="92">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-150" y1="0" x2="-130" y2="0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.8s" repeatCount="indefinite"/>
      </line>
      <line x1="-106" y1="-106" x2="-92" y2="-92">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="2.1s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
  
  <!-- 订单信息卡片 -->
  <rect x="100" y="360" width="200" height="100" rx="12" fill="rgba(255,255,255,0.95)"/>
  <text x="120" y="395" font-size="13" fill="#909399">订单编号</text>
  <text x="120" y="420" font-size="16" font-weight="bold" fill="#1a1a2e">DR20260411025</text>
  <text x="120" y="445" font-size="12" fill="#67c23a">配送完成</text>
  
  <!-- 时间信息 -->
  <rect x="500" y="360" width="200" height="100" rx="12" fill="rgba(255,255,255,0.95)"/>
  <text x="520" y="395" font-size="13" fill="#909399">送达时间</text>
  <text x="520" y="420" font-size="16" font-weight="bold" fill="#1a1a2e">12:35:28</text>
  <text x="520" y="445" font-size="12" fill="#606266">比预计提前 5 分钟</text>
  
  <!-- 装饰星星 -->
  <polygon points="150,180 155,195 170,195 158,205 163,220 150,210 137,220 142,205 130,195 145,195" fill="rgba(255,255,255,0.4)"/>
  <polygon points="650,150 653,160 663,160 655,167 658,177 650,170 642,177 645,167 637,160 647,160" fill="rgba(255,255,255,0.3)"/>
  <polygon points="700,250 703,262 715,262 705,270 709,282 700,274 691,282 695,270 685,262 697,262" fill="rgba(255,255,255,0.25)"/>
</svg>